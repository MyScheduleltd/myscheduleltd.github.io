# Render blueprint for the festival service.
#
# This is the piece myscheduleltd.com cannot host itself: GitHub Pages serves
# files and runs nothing, so shared chat, other visitors, seat claims and every
# STAFF tool need this process alive somewhere.
#
# There is no build step. The service imports only Node's own modules and the
# site's video list from the repository, so nothing is installed to run it.
#
# To deploy: Render dashboard → New → Blueprint → pick this repository. Render
# reads this file, creates the service and generates the staff key itself.
# Afterwards, read FESTIVAL_ADMIN_KEY from the service's Environment tab — that
# is the key the STAFF panel asks for. Nobody has to invent or email it.
services:
  - type: web
    name: myschedule-festival
    runtime: node
    # Named rather than left to the repository's default, so a synced
    # Blueprint can never be pointed somewhere else without it being visible
    # here. A service that does not redeploy leaves the world half-updated: the
    # page is served by Pages and moves on, while every shared rule stays where
    # it was, and the two disagree in ways that read as bugs in the world.
    branch: main
    plan: free
    # Closest free region to Taipei.
    region: singapore
    buildCommand: "echo 'no dependencies to install'"
    startCommand: node world/server/index.mjs
    # Render restarts the service if this stops answering. /api/config is the
    # public settings payload and needs no credentials.
    healthCheckPath: /api/config
    # Redeploy when main moves. Without this the service can sit on the build
    # it was created with while the repository moves on, which is impossible to
    # tell apart from a fix that did not work.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Which sites may talk to the service. The world is served from the
      # published site, so requests arrive cross-origin from this exact host.
      - key: FESTIVAL_ALLOWED_ORIGINS
        value: https://myscheduleltd.com
      # Generated by Render and never written down here. Read it from the
      # dashboard when STAFF need it, and rotate it from inside the STAFF panel.
      - key: FESTIVAL_ADMIN_KEY
        generateValue: true
      # How many attendees the world holds at once. Traffic grows with the
      # square of this, because every attendee is sent a state listing every
      # attendee: twenty is about 0.9 MB/s at a full house, which the free
      # instance carries. Anyone past it waits at the gate.
      - key: FESTIVAL_MAX_VISITORS
        value: "20"
      # Where ECPay reports a completed payment to. Declared here rather than
      # left to the dashboard because it is the switch that turns the temple's
      # offering on, it holds no secret — it is this service's own public
      # address — and a value only one person can see is a value nobody can
      # debug. Without it the world says 供養尚未開放 and gives no reason, which
      # is how the offering spent its first day live switched off.
      #
      # The service reads this first and falls back to Render's own
      # RENDER_EXTERNAL_URL. Never to a request's Host header: ECPay reports
      # payments to this address, and a caller who could name it would be
      # naming where the money reports to.
      - key: ECPAY_PUBLIC_URL
        value: https://myschedule-festival.onrender.com
      # ECPAY_INVOICE_FALLBACK_EMAIL is set in the dashboard, not here — an
      # address in a public repository is an address in a spam list. It is
      # where the 統一發票 goes when a donor does not want a receipt: ECPay
      # will not issue one without an email or a phone, and a 營業人 owes an
      # invoice on the sale either way. Until it is set, the receipt is not
      # optional and the sheet asks for an address exactly as it always has.
      #
      # Real money needs ECPAY_ENV=production plus ECPAY_MERCHANT_ID,
      # ECPAY_HASH_KEY, ECPAY_HASH_IV and the three ECPAY_INVOICE_* keys. Those
      # are secrets and belong in the dashboard, never in this file or the
      # repository. Absent them the service stays on ECPay's stage environment
      # with their published test credentials, where nothing can be charged.
