    <!--
      Warm the connection a headset's screens will need.

      Inside an immersive session a screen plays an actual media file rather
      than a YouTube iframe, and the first thing anyone sits down to is the
      handshake: DNS, TCP, TLS, all of it before a single byte of film. Doing it
      while the world is still loading takes that off the front of the first
      screening. `crossorigin` matters — the video is fetched anonymously for
      CORS, and a warm connection opened without it is a different pool and
      would not be reused.
    -->
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
