<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar rebuild · local review</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e5df;color:#222;font:15px system-ui}header{padding:20px 24px;border-bottom:1px solid #ccc6bc;display:flex;gap:24px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0 0 5px}p{margin:0;color:#625e57;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px}button,a{font:inherit}button{padding:9px 14px;background:transparent;border:1px solid #b8b1a5;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#263d36;color:white;border-color:#263d36}a{color:#263d36}iframe{display:block;border:0;width:100%;height:calc(100vh - 180px);min-height:500px}small{margin-left:auto;color:#625e57}#note{padding:0 24px 12px} @media(max-width:600px){header,nav{padding:12px}iframe{height:700px}small{margin-left:0}}
</style></head><body><header><div><h1>Character & band review</h1><p>PS2 preview · September 30 · For the owner's review</p></div><small>The festival at <a href="./?era=ps2">./?era=ps2</a> · island at <a href="./?era=ps2&amp;island">./?era=ps2&amp;island</a></small></header><nav aria-label="Choose review"><button data-view="male" aria-pressed="true">Male visitor</button><button data-view="female" aria-pressed="false">Female visitor</button><button data-view="band" aria-pressed="false">Band performance</button><button data-view="seated" aria-pressed="false">Around the fire</button><button data-view="prompts" aria-pressed="false">Location prompts</button><button data-view="roof" aria-pressed="false">Rooftop layout</button></nav><p id="note">Try the cap toggle, outfits, motion controls and Turn 45° to inspect the fit.</p><iframe id="view" title="Interactive character review" src="avatar-review.html?sex=male&pose=idle&cap&hair=c22d36&bottoms=182840"></iframe><script>
if(!['localhost','127.0.0.1'].includes(location.hostname)&&!location.pathname.includes('/beta/ps2/'))throw new Error('Review pages open locally or on the PS2 preview only');
const pages={prompts:'location-review.html',male:'avatar-review.html?sex=male&pose=idle&cap&hair=c22d36&bottoms=182840',female:'avatar-review.html?sex=female&pose=idle&cap&bottoms=182840',band:'band-review.html?play&t=60&look=0,2,0&from=0,6,-22&zoom=1.5&controls',seated:'band-review.html?t=0&look=13.5,1.6,4&from=19,8,-10&zoom=2.5&controls',roof:'band-review.html?roof&play&t=60&look=44,9,13&from=47,24,-16&zoom=.8&controls'};
for(const b of document.querySelectorAll('button[data-view]'))b.onclick=()=>{for(const x of document.querySelectorAll('button[data-view]'))x.setAttribute('aria-pressed',String(x===b));document.getElementById('view').src=pages[b.dataset.view];document.getElementById('note').textContent=['male','female'].includes(b.dataset.view)?'Try the cap toggle, outfits, motion controls and Turn 45° to inspect the fit.':'Use Pause to inspect a pose, or switch between the stage and fire. The performance is a looping 120 bpm groove.';};
</script></body></html>
