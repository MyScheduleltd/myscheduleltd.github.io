    <title>myschedule — Virtual Festival</title>
    <script>
      /*
        The art redesign is not this world. It is a second, whole build of the
        festival kept on its own channel at ./ps2/, and this sends anyone asking
        for it there before a single line of this build loads.

        Why a channel and not a flag: the redesign replaces the ground itself —
        terrain, colliders, the nav graph — so the two worlds cannot both be the
        same bundle with a branch in it. Keeping them apart is also the point.
        A published festival should not be one careless `git add` away from
        showing work nobody has approved, which is exactly how the redesign
        reached this page in the first place.

        Skipped on loopback, where there is no published channel to reach and
        `?era=ps2` keeps its older meaning as a graphics flag. The path guard is
        for the day the redesign's own build carries this file too — without it,
        that build would send ps2 to ps2 forever.
      */
      (function () {
        var loopback = ['127.0.0.1', 'localhost', ''].indexOf(location.hostname) !== -1;
        var asked = new URLSearchParams(location.search).get('era') === 'ps2';
        if (asked && !loopback && location.pathname.indexOf('/ps2/') === -1) {
          location.replace('ps2/' + location.search + location.hash);
        }
      })();
    </script>
